[package]
name = "fb-saved-dl-gui"
version = "0.1.0"
description = "Windows desktop shell for Facebook saved video downloader"
authors = ["fb-saved-dl"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
